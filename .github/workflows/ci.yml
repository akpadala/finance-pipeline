# Runs the full pipeline -- generate synthetic data, load it, build every
# dbt model, run every dbt test, check the Spark job agrees with dbt, and
# score transactions with the ML model -- on every push and pull request. This is
# the actual point of having tests at all: a broken model fails a GitHub
# Actions run with a red X, not just `dbt test` on someone's laptop that
# nobody looks at. Uses the committed synthetic sample data generator, so
# it needs no secrets, no external services, and no real bank data --
# fully reproducible from a clean checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # dbt needs this to find finance_dbt/profiles.yml instead of the
    # default ~/.dbt/profiles.yml, which doesn't exist on a fresh runner.
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/finance_dbt

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic sample data
        run: python scripts/generate_sample_data.py

      - name: Load into DuckDB
        run: python ingestion/load_to_duckdb.py

      - name: dbt seed (budget targets)
        working-directory: finance_dbt
        run: dbt seed

      - name: dbt run (build all models)
        working-directory: finance_dbt
        run: dbt run

      - name: dbt test (30+ data quality tests)
        working-directory: finance_dbt
        run: dbt test

      # PySpark runs on the JVM. Pin Java 17 explicitly rather than relying
      # on whatever the runner image happens to ship.
      - name: Set up Java (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Spark + ML dependencies
        run: pip install -r spark/requirements.txt -r ml/requirements.txt

      - name: Spark parity check (PySpark vs dbt monthly mart)
        run: python spark/monthly_spending_spark.py

      - name: Score transactions with the ML categorizer
        run: python ml/score_transactions.py

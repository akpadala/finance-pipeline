# dbt connection profile for this project.
#
# Normally dbt looks for this file at ~/.dbt/profiles.yml. Because this
# project uses DuckDB (a local file, nothing sensitive to keep out of the
# repo), we keep the profile checked in and simply tell dbt to look here
# instead, by setting an environment variable:
#
#   export DBT_PROFILES_DIR=$(pwd)/finance_dbt      # from the repo root
#
# (The README's setup steps do this for you.) If this were pointed at a
# real cloud warehouse (Snowflake/BigQuery/Redshift -- see Phase 3 in the
# README) this file would instead live outside the repo and pull
# credentials from environment variables, since it would then contain
# secrets.

finance_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      # relative to the *project* root when run via `dbt` from finance_dbt/
      path: ../warehouse/finance.duckdb
      threads: 4

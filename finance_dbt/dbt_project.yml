name: 'finance_dbt'
version: '1.0.0'
config-version: 2

profile: 'finance_dbt'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Layered model config: each folder = a layer of the pipeline. Staging views
# are cheap and always fresh; marts are materialized as tables so the
# Streamlit dashboard queries something already computed, not recomputed
# on every page load.
models:
  finance_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  finance_dbt:
    +schema: seeds
